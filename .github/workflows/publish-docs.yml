name: Build and publish documentation

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize


jobs:
  build-docs:
    if: github.repository == 'bambinos/formulae'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.63.2
          environments: "dev"

      - name: Build documentation
        shell: bash
        run: |
          cd docs
          pixi run -e dev python -m quartodoc build --verbose
          pixi run -e dev python -m quartodoc interlinks
          quarto render
          touch _site/.nojekyll
          pixi run -e dev python -m sphobjinv convert -o zlib objects.txt objects.inv
          mv objects.inv _site/objects.inv
          ls _site

      - name: Publish documentation to GitHub Pages
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags')
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
          path: docs/_site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
